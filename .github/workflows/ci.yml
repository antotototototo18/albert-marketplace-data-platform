name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, antho]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      - name: Install check tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run repository and workflow checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Test contributor policy
        run: python -m unittest discover --start-directory tests --verbose

      - name: Require group members as contributors and commit authors
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_contributors.py

      - name: Reject tracked files covered by gitignore
        shell: bash
        run: |
          ignored_files="$(git ls-files --cached --ignored --exclude-standard)"
          if [[ -n "$ignored_files" ]]; then
            echo 'Remove these ignored files from the Git index:'
            printf '%s\n' "$ignored_files"
            exit 1
          fi
